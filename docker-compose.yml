services:
  pg:
    image: postgres:16-alpine
    container_name: freelance-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB',
        ]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s

  migrate:
    image: freelance-platform-backend
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: freelance-platform-migrate
    env_file:
      - .env
    environment:
      DB_HOST: pg
      DB_PORT: '5432'
    depends_on:
      pg:
        condition: service_healthy
    command: ['sh', '-c', 'yarn migrate:init && yarn migrate']
    restart: 'no'

  seed:
    image: freelance-platform-backend
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: freelance-platform-seed
    env_file:
      - .env
    environment:
      DB_HOST: pg
      DB_PORT: '5432'
    depends_on:
      migrate:
        condition: service_completed_successfully
      pg:
        condition: service_healthy
    command: ['sh', '-c', 'yarn seed:init && yarn seed']
    restart: 'no'

  backend:
    image: freelance-platform-backend
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: freelance-platform-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_HOST: pg
      DB_PORT: '5432'
      PORT: '3000'
    depends_on:
      seed:
        condition: service_completed_successfully
      pg:
        condition: service_healthy
    expose:
      - '3000'

  frontend:
    image: freelance-platform-frontend
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: freelance-platform-frontend
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      - backend

volumes:
  postgres_data:
