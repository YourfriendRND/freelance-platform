<header class="ui-brand-header">
  <div class="ui-brand-header__brand">
    <div class="ui-brand-header__logo" aria-hidden="true">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="28"
        height="28"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
        <rect width="20" height="14" x="2" y="6" rx="2"></rect>
      </svg>
    </div>
    <span class="ui-brand-header__name">{{ brandName() }}</span>
  </div>

  <h1 class="ui-brand-header__title">{{ title() }}</h1>
  <p class="ui-brand-header__subtitle">{{ subtitle() }}</p>
</header>
