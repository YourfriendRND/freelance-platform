<div
  class="ui-dashboard-wrapper"
  [class.ui-dashboard-wrapper--menu-open]="menuOpen()"
>
  <aside class="ui-dashboard-wrapper__sidebar" (click)="onSidebarClick($event)">
    <button
      type="button"
      class="ui-dashboard-wrapper__close"
      aria-label="Закрыть меню"
      (click)="onCloseMenu()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M18 6 6 18"></path>
        <path d="m6 6 12 12"></path>
      </svg>
    </button>
    <ng-content select="[uiDashboardSidebar]" />
  </aside>

  <div class="ui-dashboard-wrapper__main">
    <button
      type="button"
      class="ui-dashboard-wrapper__backdrop"
      aria-label="Закрыть меню"
      (click)="onCloseMenu()"
    ></button>
    <div class="ui-dashboard-wrapper__header">
      <button
        type="button"
        class="ui-dashboard-wrapper__menu"
        [attr.aria-expanded]="menuOpen()"
        aria-label="Меню"
        (click)="onToggleMenu()"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M4 6h16"></path>
          <path d="M4 12h16"></path>
          <path d="M4 18h16"></path>
        </svg>
      </button>
      <ng-content select="[uiDashboardHeader]" />
    </div>

    <div class="ui-dashboard-wrapper__body">
      <ng-content />
    </div>
  </div>
</div>
