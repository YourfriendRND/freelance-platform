<div class="ui-select" [class.ui-select--invalid]="!!error()">
  <label class="ui-select__label" [attr.for]="inputId()">{{ label() }}</label>

  <div class="ui-select__control">
    <select
      class="ui-select__input"
      [attr.id]="inputId()"
      [disabled]="isDisabled()"
      [value]="value() ?? ''"
      (change)="onSelect($event)"
      (blur)="onBlur()"
    >
      @if (placeholder()) {
        <option value="" disabled>{{ placeholder() }}</option>
      }

      @for (option of options(); track option.value) {
        <option [value]="option.value">{{ option.label }}</option>
      }
    </select>
  </div>

  @if (error()) {
    <p class="ui-select__error" role="alert">{{ error() }}</p>
  }
</div>
