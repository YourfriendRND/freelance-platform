<footer class="ui-footer">
  <div class="ui-footer__inner">
    <div class="ui-footer__top">
      <div class="ui-footer__brand-block">
        <a
          class="ui-footer__brand"
          [attr.href]="homeHref()"
          (click)="homeClick.emit($event)"
        >
          <span class="ui-footer__logo" aria-hidden="true">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
              <rect width="20" height="14" x="2" y="6" rx="2"></rect>
            </svg>
          </span>
          <span class="ui-footer__brand-name">{{ brandName() }}</span>
        </a>
        <p class="ui-footer__tagline">{{ tagline() }}</p>
      </div>

      <div class="ui-footer__columns">
        @for (column of columns; track column.title) {
          <div class="ui-footer__column">
            <h2 class="ui-footer__column-title">{{ column.title }}</h2>
            <ul class="ui-footer__links">
              @for (link of column.links; track link.label) {
                <li>
                  <a
                    class="ui-footer__link"
                    [attr.href]="link.href"
                    (click)="onLinkClick(link, $event)"
                  >
                    {{ link.label }}
                  </a>
                </li>
              }
            </ul>
          </div>
        }
      </div>
    </div>

    <div class="ui-footer__bottom">
      <p class="ui-footer__copyright">{{ copyrightText() }}</p>
    </div>
  </div>
</footer>
