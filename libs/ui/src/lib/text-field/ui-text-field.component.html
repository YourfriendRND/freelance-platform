<div class="ui-text-field" [class.ui-text-field--invalid]="!!error()">
  <label class="ui-text-field__label" [attr.for]="inputId()">
    {{ label() }}
    @if (required()) {
      <span class="ui-text-field__required" aria-hidden="true">*</span>
    }
  </label>

  @if (multiline()) {
    <textarea
      class="ui-text-field__input ui-text-field__input--textarea"
      [attr.id]="inputId()"
      [attr.placeholder]="placeholder()"
      [attr.autocomplete]="autocomplete()"
      [disabled]="isDisabled()"
      [value]="value()"
      (input)="onInput($event)"
      (blur)="onBlur()"
    ></textarea>
  } @else {
    <input
      class="ui-text-field__input"
      [attr.id]="inputId()"
      [attr.type]="type()"
      [attr.placeholder]="placeholder()"
      [attr.autocomplete]="autocomplete()"
      [disabled]="isDisabled()"
      [value]="value()"
      (input)="onInput($event)"
      (blur)="onBlur()"
    />
  }

  @if (hint() && !error()) {
    <p class="ui-text-field__hint">{{ hint() }}</p>
  }

  @if (error()) {
    <p class="ui-text-field__error" role="alert">{{ error() }}</p>
  }
</div>
