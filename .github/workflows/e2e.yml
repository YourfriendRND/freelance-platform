name: E2E

on:
  push:
    branches:
      - main

concurrency:
  group: e2e
  cancel-in-progress: true

env:
  NODE_ENV: development
  DB_HOST: localhost
  DB_PORT: 5432
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_NAME_E2E: freelance_platform_e2e
  SALT_WORD: change-me-in-production
  APP_PREFIX: app
  SESSION_LIFETIME_SECONDS: 1800
  REFRESH_AFTER_SECONDS: 3600

jobs:
  e2e-backend:
    name: Backend e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run backend e2e
        run: yarn backend:e2e

  e2e-frontend:
    name: Frontend e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps

      - name: Run frontend e2e
        run: yarn frontend:e2e
