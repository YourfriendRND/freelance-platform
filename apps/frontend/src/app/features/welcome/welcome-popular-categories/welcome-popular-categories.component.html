@if (categories().length > 0) {
  <section class="welcome-categories">
    <h2 class="welcome-categories__title">Популярные категории</h2>
    <p class="welcome-categories__subtitle">Смотрите задачи в разных категориях</p>

    <ul class="welcome-categories__grid">
      @for (category of categories(); track category.id) {
        <li>
          <a
            class="welcome-categories__card"
            [routerLink]="['/tasks']"
            [queryParams]="{ categoryId: category.id }"
          >
            <span class="welcome-categories__icon" aria-hidden="true">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
                <polyline points="16 7 22 7 22 13"></polyline>
              </svg>
            </span>
            <span class="welcome-categories__name">{{ category.title }}</span>
            <span class="welcome-categories__count">{{ formatTaskCount(category.taskCount) }}</span>
          </a>
        </li>
      }
    </ul>
  </section>
}
