<ui-dashboard-wrapper>
  <app-dashboard-sidebar
    uiDashboardSidebar
    activeItem="profile"
  />

  <app-header
    uiDashboardHeader
    [showBrand]="false"
    [embedded]="true"
  />

  <app-profile-page-container>
    @switch (view()) {
      @case (profilePageView.Loading) {
        <p class="profile-page__status">Загрузка</p>
      }
      @case (profilePageView.Error) {
        <p class="profile-page__status">
          {{ errorMessage() ?? 'Не удалось загрузить профиль' }}
        </p>
      }
      @case (profilePageView.Content) {
        @if (profile(); as profileData) {
          <div class="profile-page__content">
            @if (isEditing() && profileUser(); as user) {
              <app-profile-edit-form
                [user]="user"
                (saved)="onProfileSaved($event)"
                (cancelled)="onEditCancelled()"
              />
            } @else {
              <app-profile-card
                [displayName]="profileData.displayName"
                [email]="profileData.email"
                [roleLabel]="profileData.roleLabel"
                [registrationLabel]="profileData.registrationLabel"
                [bio]="profileData.bio"
                [birthdayLabel]="profileData.birthdayLabel"
                [rating]="profileData.rating"
                [reviewsCount]="profileData.reviewsCount"
                [isFreelancer]="profileData.isFreelancer"
                [rateLabel]="profileData.rateLabel"
                (edit)="onEdit()"
              />
            }
            <app-profile-statistics
              [rating]="profileData.rating"
              [reviewsCount]="profileData.reviewsCount"
            />
          </div>
        }
      }
    }
  </app-profile-page-container>
</ui-dashboard-wrapper>
