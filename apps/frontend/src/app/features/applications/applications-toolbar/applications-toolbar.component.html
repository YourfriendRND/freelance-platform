<div class="applications-toolbar">
  <div class="applications-toolbar__tabs" role="tablist" aria-label="Фильтр откликов">
    @for (tab of tabs; track tab.value) {
      <button
        class="applications-toolbar__tab"
        type="button"
        role="tab"
        [class.applications-toolbar__tab--active]="activeTab() === tab.value"
        [attr.aria-selected]="activeTab() === tab.value"
        (click)="onTabClick(tab.value)"
      >
        {{ tab.label }}
      </button>
    }
  </div>

  <label class="applications-toolbar__search">
    <span class="applications-toolbar__search-icon" aria-hidden="true">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.3-4.3"></path>
      </svg>
    </span>
    <span class="applications-toolbar__sr-only">Поиск</span>
    <input
      #searchInput
      class="applications-toolbar__search-input"
      type="search"
      [value]="search()"
      placeholder="Поиск по задачам или заказчикам"
      autocomplete="off"
      (input)="onSearchInput(searchInput.value)"
    />
  </label>
</div>
