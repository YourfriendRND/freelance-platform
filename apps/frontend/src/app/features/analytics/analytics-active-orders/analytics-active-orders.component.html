    <button type="button" class="analytics-panel__action" disabled>Смотреть все</button>

  <div class="analytics-panel__empty">

      <svg

        width="28"
        height="28"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect width="20" height="14" x="2" y="7" rx="2"></rect>
        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
      </svg>
    </span>
    <p class="analytics-panel__empty-title">Нет активных заказов</p>
    <p class="analytics-panel__empty-hint">Откликнитесь на задачи, чтобы начать работу</p>
  </div>
</section>
