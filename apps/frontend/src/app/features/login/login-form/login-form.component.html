<form class="login-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  <ui-text-field
    formControlName="email"
    inputId="login-email"
    label="Электронная почта"
    type="email"
    placeholder="you@example.com"
    autocomplete="email"
    [error]="fieldError('email')"
  />

  <ui-text-field
    formControlName="password"
    inputId="login-password"
    label="Пароль"
    type="password"
    placeholder="••••••••"
    autocomplete="current-password"
    [error]="fieldError('password')"
  />

  @if (submitError(); as errorMessage) {
    <p class="login-form__submit-error" role="alert">{{ errorMessage }}</p>
  }

  <ui-button type="submit" [fullWidth]="true" [disabled]="submitting()">
    {{ submitting() ? 'Вход…' : 'Войти' }}
  </ui-button>
</form>
