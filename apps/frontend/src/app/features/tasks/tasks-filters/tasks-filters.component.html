<form class="tasks-filters" [formGroup]="form" (submit)="$event.preventDefault()">
  <label class="tasks-filters__search" for="tasks-search">
    <span class="tasks-filters__search-icon" aria-hidden="true">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.3-4.3"></path>
      </svg>
    </span>
    <span class="tasks-filters__sr-only">Поиск</span>
    <input
      id="tasks-search"
      class="tasks-filters__search-input"
      type="text"
      formControlName="search"
      placeholder="Поиск по названию или описанию"
      autocomplete="off"
    />
  </label>

  <div class="tasks-filters__row">
    <ui-select
      class="tasks-filters__control"
      formControlName="category"
      inputId="tasks-category"
      label="Категория"
      [options]="categoryOptions()"
    />

    <ui-select
      class="tasks-filters__control"
      formControlName="status"
      inputId="tasks-status"
      label="Статус"
      [options]="statusOptions"
    />

    <label class="tasks-filters__field" for="tasks-budget-min">
      <span class="tasks-filters__label">Мин. бюджет</span>
      <input
        id="tasks-budget-min"
        class="tasks-filters__input"
        type="number"
        inputmode="numeric"
        min="0"
        formControlName="budgetMin"
        placeholder="0"
      />
    </label>

    <label class="tasks-filters__field" for="tasks-budget-max">
      <span class="tasks-filters__label">Макс. бюджет</span>
      <input
        id="tasks-budget-max"
        class="tasks-filters__input"
        type="number"
        inputmode="numeric"
        min="0"
        formControlName="budgetMax"
        placeholder="Любой"
      />
    </label>
  </div>

  <div class="tasks-filters__meta">
    <p class="tasks-filters__count">
      Показано {{ shownCount() }} из {{ totalCount() }} задач
    </p>

    <label class="tasks-filters__sort" for="tasks-sort">
      <span class="tasks-filters__sort-label">Сортировка</span>
      <span class="tasks-filters__sort-control">
        <select id="tasks-sort" class="tasks-filters__sort-select" formControlName="sort">
          @for (option of sortOptions; track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
      </span>
    </label>
  </div>
</form>
