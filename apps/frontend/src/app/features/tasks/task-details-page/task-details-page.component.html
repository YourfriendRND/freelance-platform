<ui-dashboard-wrapper>
  <app-dashboard-sidebar
    uiDashboardSidebar
    activeItem="tasks"
  />

  <app-header
    uiDashboardHeader
    [showBrand]="false"
    [embedded]="true"
  />

  <app-tasks-page-container>
    <a routerLink="/tasks" class="task-details-page__back">← Назад к задачам</a>

    @switch (view()) {
      @case (ApplicationsPageView.Loading) {
        <p class="task-details-page__status">Загрузка</p>
      }
      @case (ApplicationsPageView.Error) {
        <p class="task-details-page__status">
          {{ errorMessage() ?? 'Не удалось загрузить задачу' }}
        </p>
      }
      @case (ApplicationsPageView.Content) {
        @if (task(); as details) {
          <div class="task-details-page__layout">
            <app-task-details [task]="details" />
            <div class="task-details-page__aside">
              <app-task-details-aside [task]="details" />
              <app-task-details-apply-button
                [status]="details.status"
                [taskId]="details.id"
                (apply)="onOpenApplyForm()"
              />
            </div>
          </div>

          @if (isApplyFormOpen()) {
            <app-task-details-apply-form
              [taskId]="details.id"
              [taskTitle]="details.title"
              [budgetMin]="details.budgetMin"
              [budgetMax]="details.budgetMax"
              (closed)="onCloseApplyForm()"
            />
          }
        }
      }
    }
  </app-tasks-page-container>
</ui-dashboard-wrapper>
