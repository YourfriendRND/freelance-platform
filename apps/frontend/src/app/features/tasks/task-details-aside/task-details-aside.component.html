<div class="task-details-aside">
  <article class="task-details-aside__card">
    <p class="task-details-aside__label">
      <span class="task-details-aside__icon" aria-hidden="true">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"
          ></path>
          <path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"></path>
        </svg>
      </span>
      Бюджет
    </p>
    <p class="task-details-aside__value">{{ budgetLabel() }}</p>
    <p class="task-details-aside__hint">Диапазон бюджета</p>
  </article>

  <article class="task-details-aside__card">
    <p class="task-details-aside__label">
      <span class="task-details-aside__icon" aria-hidden="true">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M8 2v4"></path>
          <path d="M16 2v4"></path>
          <rect width="18" height="18" x="3" y="4" rx="2"></rect>
          <path d="M3 10h18"></path>
        </svg>
      </span>
      Срок
    </p>
    <p class="task-details-aside__value">{{ deadlineLabel() }}</p>
    <p class="task-details-aside__hint">Ожидаемое завершение</p>
  </article>

  <article class="task-details-aside__card">
    <p class="task-details-aside__label">Категория</p>
    <p class="task-details-aside__tag">{{ task().categoryTitle }}</p>
  </article>
</div>
