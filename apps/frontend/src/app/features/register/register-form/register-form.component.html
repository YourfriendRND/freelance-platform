<form class="register-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  <ui-select
    formControlName="role"
    inputId="register-role"
    label="Я хочу"
    placeholder="Выберите тип аккаунта"
    [options]="roleOptions"
    [error]="roleError()"
  />

  <div class="register-form__row">
    <ui-text-field
      formControlName="firstName"
      inputId="register-first-name"
      label="Имя"
      placeholder="Иван"
      autocomplete="given-name"
      [error]="fieldError('firstName')"
    />

    <ui-text-field
      formControlName="lastName"
      inputId="register-last-name"
      label="Фамилия"
      placeholder="Иванов"
      autocomplete="family-name"
      [error]="fieldError('lastName')"
    />
  </div>

  <ui-text-field
    formControlName="email"
    inputId="register-email"
    label="Электронная почта"
    type="email"
    placeholder="you@example.com"
    autocomplete="email"
    [error]="fieldError('email')"
  />

  <ui-text-field
    formControlName="password"
    inputId="register-password"
    label="Пароль"
    type="password"
    placeholder="••••••••"
    autocomplete="new-password"
    [error]="fieldError('password')"
  />

  <ui-text-field
    formControlName="confirmPassword"
    inputId="register-confirm-password"
    label="Подтвердите пароль"
    type="password"
    placeholder="••••••••"
    autocomplete="new-password"
    [error]="confirmPasswordError()"
  />

  <ui-checkbox formControlName="acceptTerms" inputId="register-accept-terms" [error]="fieldError('acceptTerms')">
    Я согласен с
    <a href="#" class="register-form__link" (click)="$event.preventDefault()">Условиями использования</a>
    и
    <a href="#" class="register-form__link" (click)="$event.preventDefault()">Политикой конфиденциальности</a>.
  </ui-checkbox>

  <ui-button type="submit" [fullWidth]="true">Создать аккаунт</ui-button>
</form>
