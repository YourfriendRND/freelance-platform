<ui-page-wrapper>
  <ui-header
    uiPageHeader
    mode="guest"
    loginHref="/login"
    getStartedHref="/register"
  />

  <ui-auth-container>
    <ui-brand-header
      brandName="TaskFlow"
      title="Создать аккаунт"
      subtitle="Присоединяйтесь к тысячам пользователей TaskFlow"
    />

    <ui-auth-card>
      <app-register-form />

      <p class="register-page__sign-in">
        Уже есть аккаунт?
        <a routerLink="/login" class="register-page__link">Войти</a>
      </p>
    </ui-auth-card>

    <a routerLink="/welcome" class="register-page__back">← На главную</a>
  </ui-auth-container>

  <ui-footer uiPageFooter />
</ui-page-wrapper>
